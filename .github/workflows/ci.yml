name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma:generate
        env:
          DATABASE_URL: postgresql://build:build@127.0.0.1:5432/build
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:bc6ab0d6d44ff4826e4cb8c1e6d801e185bfc42bb0753f8e2a30efc70db054c7
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma Client
        run: pnpm prisma:generate
        env:
          DATABASE_URL: postgresql://build:build@127.0.0.1:5432/build
      - name: Verify pinned Playwright runtime
        run: |
          test "$(uname -m)" = "x86_64"
          test "$(node --version)" = "v24.21.0"
          test "$(pnpm --version)" = "10.33.2"
          test "$(pnpm exec playwright --version)" = "Version 1.63.0"
          browser_path="$(node -e 'const { chromium } = require("@playwright/test"); process.stdout.write(chromium.executablePath())')"
          test -x "$browser_path"
          "$browser_path" --version
      - name: Run public end-to-end tests
        run: pnpm test:e2e --project=desktop-1440 --grep-invert @authenticated
        env:
          BETTER_AUTH_SECRET: ci-secret-that-is-longer-than-thirty-two-characters
          DATABASE_URL: postgresql://build:build@127.0.0.1:5432/build
          PUBLIC_CONTACT_ENABLED: "false"
          CONTACT_DELIVERY_VERIFIED: "false"
      - name: Upload Playwright failure diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 7
